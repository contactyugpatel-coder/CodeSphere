
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSphere | Yug Patel</title>

    <!--editor styles -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        header {
            height: 70px;
            padding: 0 22px;
            background: #111827;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 4px;
        }

        .status {
            color: #4ade80;
            font-size: 13px;
        }

        /* Toolbar */
        .toolbar {
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        button,
        select,
        input {
            font: inherit;
        }

        button,
        select {
            border: none;
            border-radius: 6px;
            padding: 9px 12px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 12px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .secondary {
            background: #334155;
        }

        .secondary:hover {
            background: #475569;
        }

        .danger {
            background: #dc2626;
        }

        .danger:hover {
            background: #b91c1c;
        }

        .toolbar-label {
            color: #cbd5e1;
            font-size: 12px;
            margin-left: 5px;
        }

        /* Project bar */
        .project-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }

        .project-bar label {
            font-size: 12px;
            color: #94a3b8;
        }

        #projectSelect {
            min-width: 150px;
        }

        /* Main split-screen layout */
        .workspace {
            display: flex;
            gap: 0;
            padding: 16px;
            height: calc(100vh - 155px);
            min-height: 550px;
            max-width: 1800px;
            margin: auto;
        }

        .panel {
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .editor-panel {
            width: 50%;
            min-width: 240px;
        }

        .preview-panel {
            flex: 1;
            min-width: 240px;
        }

        /* Draggable divider */
        .resizer {
            width: 12px;
            cursor: col-resize;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .resizer::after {
            content: "";
            width: 4px;
            height: 65px;
            border-radius: 5px;
            background: #475569;
        }

        .resizer:hover::after {
            background: #38bdf8;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            padding: 13px 15px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
        }

        .panel-subtitle {
            color: #38bdf8;
            font-size: 11px;
            margin-left: 7px;
        }

        .panel-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        /* CodeMirror */
        .editor-area {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .CodeMirror {
            height: 100%;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .editor-footer,
        .preview-footer {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: 9px 13px;
            background: #1e293b;
            color: #94a3b8;
            font-size: 11px;
        }

        /* Preview controls */
        .device-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .device-controls button.active {
            background: #0891b2;
            outline: 2px solid #67e8f9;
        }

        .preview-area {
            flex: 1;
            min-height: 0;
            padding: 14px;
            background: #cbd5e1;
            display: flex;
            align-items: stretch;
            justify-content: center;
            overflow: auto;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 300px;
            border: none;
            background: white;
            border-radius: 6px;
            transition: width 0.2s ease;
        }

        .device-tablet {
            width: 768px;
            max-width: 100%;
        }

        .device-mobile {
            width: 375px;
            max-width: 100%;
        }

        /* Template modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 20;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            width: min(700px, 100%);
            max-height: 85vh;
            overflow-y: auto;
            background: #111827;
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .templates {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .template-card {
            text-align: left;
            padding: 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 9px;
            cursor: pointer;
            color: #e2e8f0;
        }

        .template-card:hover {
            border-color: #38bdf8;
            background: #26364c;
        }

        .template-card h3 {
            margin: 0 0 8px;
            font-size: 15px;
        }

        .template-card p {
            margin: 0;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
        }

        .empty-message {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 850px) {
            .workspace {
                flex-direction: column;
                height: auto;
                min-height: 0;
                gap: 12px;
            }

            .editor-panel,
            .preview-panel {
                width: 100%;
                min-width: 0;
                height: 500px;
                flex: none;
            }

            .resizer {
                display: none;
            }

            .templates {
                grid-template-columns: 1fr;
            }

            header {
                padding: 0 14px;
            }

            .status {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div>
            <div class="logo">CodeSphere</div>
            <div class="subtitle">Created by Yug Patel</div>
        </div>

        <div class="status">● Live Preview Active</div>

    <!-- Main toolbar -->

                </iframe>
            </div>

            <div class="preview-footer">
                <span>Output updates automatically</span>
                <span id="previewInfo">Desktop: 100%</span>
            </div>

        </section>

    </main>

    <!-- Template-->
    <div class="modal" id="templateModal">
        <div class="modal-content">

            <div class="modal-header">

            <div class="templates">

                <button class="template-card"

            </div>
        </div>
    </div>

        };

        
        let projects = {};
        let currentProject = "";
        let editor;
        let currentDevice = "desktop";
        let updateTimer;

        
        function loadProjects() {
            try {
                projects = JSON.parse(
                    localStorage.getItem("codeflowProjects")
                ) || {};
            } catch {
                projects = {};
            }

            if (Object.keys(projects).length === 0) {
                projects["My First Project"] = defaultCode;
            }

            currentProject = localStorage.getItem("codeflowCurrent")
                || Object.keys(projects)[0];

            if (!projects[currentProject]) {
                currentProject = Object.keys(projects)[0];
            }
        }

        
        function saveProjects() {
            localStorage.setItem(
                "codeflowProjects",
                JSON.stringify(projects)
            );

            localStorage.setItem(
                "codeflowCurrent",
                currentProject
            );
        }

        
        function updateProjectSelect() {
            const select = document.getElementById("projectSelect");

            select.innerHTML = "";

            Object.keys(projects).forEach(function(name) {
                const option = document.createElement("option");

                option.value = name;
                option.textContent = name;

                if (name === currentProject) {
                    option.selected = true;
                }

                select.appendChild(option);
            });
        }

        
        function newProject() {
            let name = prompt("Enter a project name:");

            if (!name) {
                return;
            }

            name = name.trim();

            if (!name) {
                return;
            }

            if (projects[name]) {
                alert("A project with this name already exists.");
                return;
            }

            projects[name] = defaultCode;
            currentProject = name;

            saveProjects();
            updateProjectSelect();

            editor.setValue(defaultCode);
            refreshPreview();
        }

        /* Save the current project */
        function saveCurrentProject() {
            projects[currentProject] = editor.getValue();

            saveProjects();

            alert("Project saved successfully!");
        }

        
        function switchProject(name) {
            if (!projects[name]) {
                return;
            }

            currentProject = name;
            editor.setValue(projects[name]);

            saveProjects();
            refreshPreview();
        }

        
        function renameProject() {
            const newName = prompt(
                "Enter the new project name:",
                currentProject
            );

            if (!newName || !newName.trim()) {
                return;
            }

            const name = newName.trim();

            if (name !== currentProject && projects[name]) {
                alert("That project name already exists.");
                return;
            }

            projects[name] = projects[currentProject];

            if (name !== currentProject) {
                delete projects[currentProject];
            }

            currentProject = name;

            saveProjects();
            updateProjectSelect();
        }

        
        function deleteProject() {
            const names = Object.keys(projects);

            if (names.length <= 1) {
                alert("At least one project must remain.");
                return;
            }

            if (!confirm("Delete this project permanently?")) {
                return;
            }

            delete projects[currentProject];

            currentProject = Object.keys(projects)[0];

            saveProjects();
            updateProjectSelect();

            editor.setValue(projects[currentProject]);
            refreshPreview();
        }

       
        function initializeEditor() {
            editor = CodeMirror(
                document.getElementById("editorArea"),
                {
                    value: projects[currentProject],
                    mode: {
                        name: "htmlmixed",
                        tags: {
                            style: [["css"]],
                            script: [["javascript"]]
                        }
                    },
                    theme: "dracula",
                    lineNumbers: true,
                    lineWrapping: false,
                    indentUnit: 4,
                    tabSize: 4,
                    indentWithTabs: false,
                    autoCloseBrackets: true,
                    matchBrackets: true,
                    viewportMargin: Infinity
                }
            );

            editor.on("change", function() {
                updateEditorInfo();

                clearTimeout(updateTimer);

                updateTimer = setTimeout(function() {
                    refreshPreview();
                }, 100);
            });

            updateEditorInfo();
        }

        
        function updateEditorInfo() {
            if (!editor) {
                return;
            }

            const code = editor.getValue();

            document.getElementById("editorInfo").textContent =
                code.length + " characters | " +
                (code ? code.split("\n").length : 0) + " lines";
        }

        
        function refreshPreview() {
            if (!editor) {
                return;
            }

            const code = editor.getValue();

            document.getElementById("preview").srcdoc = code;

            projects[currentProject] = code;
            saveProjects();

            updateEditorInfo();
        }

       
        function resetCode() {
            if (!confirm("Reset this project to the starter code?")) {
                return;
            }

            editor.setValue(defaultCode);
            refreshPreview();
        }

        
        function clearCode() {
            if (!confirm("Clear all code in this project?")) {
                return;
            }

            editor.setValue("");
            refreshPreview();
        }

       
        function copyCode() {
            const code = editor.getValue();

            if (navigator.clipboard) {
                navigator.clipboard.writeText(code)
                    .then(() => alert("Code copied successfully!"))
                    .catch(() => alert("Copy failed."));
            } else {
                alert("Clipboard access is unavailable.");
            }
        }

       
        function downloadHTML() {
            const code = editor.getValue();

            const blob = new Blob(
                [code],
                { type: "text/html" }
            );

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download = currentProject + ".html";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            URL.revokeObjectURL(url);
        }

        
        function formatCode() {
            const code = editor.getValue();

            
            let formatted = code
                .replace(/>\s*</g, ">\n<")
                .replace(/^\s+|\s+$/g, "");

            let depth = 0;
            const lines = formatted.split("\n");
            const output = [];

            lines.forEach(function(line) {
                line = line.trim();

                if (!line) {
                    return;
                }

                if (
                    /^<\/.+>/.test(line) &&
                    !/^<\//.test(line) === false
                ) {
                    depth = Math.max(0, depth - 1);
                }

                output.push("    ".repeat(depth) + line);

                if (
                    /^<[^!/][^>]*>$/.test(line) &&
                    !/<\/[^>]+>$/.test(line) &&
                    !/\/>$/.test(line) &&
                    !/^<(meta|link|input|img|br|hr)/i.test(line)
                ) {
                    depth++;
                }
            });

            editor.setValue(output.join("\n"));
            refreshPreview();
        }

        
        function setDevice(device) {
            currentDevice = device;

            const preview = document.getElementById("preview");
            const buttons = [
                document.getElementById("desktopBtn"),
                document.getElementById("tabletBtn"),
                document.getElementById("mobileBtn")
            ];

            buttons.forEach(button => {
                button.classList.remove("active");
                button.classList.add("secondary");
            });

            if (device === "desktop") {
                preview.style.width = "100%";
                document.getElementById("desktopBtn").classList.add("active");
                document.getElementById("desktopBtn").classList.remove("secondary");

                document.getElementById("previewInfo").textContent =
                    "Desktop: 100%";
            }

            if (device === "tablet") {
                preview.style.width = "768px";
                document.getElementById("tabletBtn").classList.add("active");
                document.getElementById("tabletBtn").classList.remove("secondary");

                document.getElementById("previewInfo").textContent =
                    "Tablet: 768px";
            }

            if (device === "mobile") {
                preview.style.width = "375px";
                document.getElementById("mobileBtn").classList.add("active");
                document.getElementById("mobileBtn").classList.remove("secondary");

                document.getElementById("previewInfo").textContent =
                    "Mobile: 375px";
            }
        }

        
        function openFullscreen() {
            const preview = document.getElementById("preview");

            if (preview.requestFullscreen) {
                preview.requestFullscreen();
            } else {
                alert("Fullscreen is not supported.");
            }
        }

       
        function openTemplates() {
            document.getElementById("templateModal")
                .classList.add("open");
        }

        function closeTemplates() {
            document.getElementById("templateModal")
                .classList.remove("open");
        }

        function useTemplate(templateName) {
            if (!templates[templateName]) {
                return;
            }

            const templateCode = templates[templateName];

            if (
                editor.getValue().trim() &&
                !confirm("Replace the current code with this template?")
            ) {
                return;
            }

            editor.setValue(templateCode);
            closeTemplates();
            refreshPreview();
        }

        
        function enableResizer() {
            const resizer = document.getElementById("resizer");
            const editorPanel = document.getElementById("editorPanel");
            const workspace = document.getElementById("workspace");

            let dragging = false;

            resizer.addEventListener("pointerdown", function(event) {
                if (window.innerWidth <= 850) {
                    return;
                }

                dragging = true;
                resizer.setPointerCapture(event.pointerId);
                document.body.style.cursor = "col-resize";
            });

            resizer.addEventListener("pointermove", function(event) {
                if (!dragging) {
                    return;
                }

                const rect = workspace.getBoundingClientRect();
                const newWidth = event.clientX - rect.left - 16;

                const minimum = 240;
                const maximum = rect.width - 280;

                const width = Math.max(
                    minimum,
                    Math.min(newWidth, maximum)
                );

                editorPanel.style.width = width + "px";

                if (editor) {
                    editor.refresh();
                }
            });

            function stopDragging() {
                dragging = false;
                document.body.style.cursor = "";
            }

            resizer.addEventListener("pointerup", stopDragging);
            resizer.addEventListener("pointercancel", stopDragging);
        }

        
        document.addEventListener("keydown", function(event) {
            if ((event.ctrlKey || event.metaKey) && event.key === "s") {
                event.preventDefault();
                saveCurrentProject();
            }
        });

        
        document.getElementById("templateModal")
            .addEventListener("click", function(event) {
                if (event.target === this) {
                    closeTemplates();
                }
            });

        
        loadProjects();
        updateProjectSelect();
        initializeEditor();
        enableResizer();
        setDevice("desktop");
        refreshPreview();
    </script>

</body>
</html>
